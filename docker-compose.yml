services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:?REDIS_PORT is required}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ./backend/gateway
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: "${GATEWAY_PORT:?GATEWAY_PORT is required}"
      REDIS_URL: "${REDIS_URL:?REDIS_URL is required}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      FINNHUB_URL: "${FINNHUB_URL:?FINNHUB_URL is required}"
      FINNHUB_TOKEN: "${FINNHUB_TOKEN:?FINNHUB_TOKEN is required}"
    ports:
      - "${GATEWAY_PORT:?GATEWAY_PORT is required}:8080"

  ingestor:
    build:
      context: ./backend/ingestor
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: "${REDIS_URL:?REDIS_URL is required}"
      FINNHUB_WS_URL: "${FINNHUB_WS_URL:?FINNHUB_WS_URL is required}"
      FINNHUB_TOKEN: "${FINNHUB_TOKEN:?FINNHUB_TOKEN is required}"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: "${VITE_API_URL:?VITE_API_URL is required}"
        VITE_WS_URL: "${VITE_WS_URL:?VITE_WS_URL is required}"
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "${CLIENT_PORT:?CLIENT_PORT is required}:3000"
